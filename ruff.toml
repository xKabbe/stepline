line-length = 120

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
    "PT",
    "ANN",
    "D",
    "D213",
    "T20",
    "PTH"
]
ignore = [
    "D105",
    "D107",
    "D212"
]

[lint.pydocstyle]
convention = "google"

[format]
docstring-code-format = true
