[tasks.lint]
help = "Lint all code"
cmd = "ruff check"

[tasks.imports]
help = "Check the architecture rules for imports"
cmd = "lint-imports"

[tasks.format]
help = "Format all code"
cmd = "ruff format"

[tasks.format-check]
help = "Check that all code is formatted"
cmd = "ruff format --check"

[tasks.typecheck]
help = "Run strict type checks"
cmd = "pyright"

[tasks.test]
help = "Run the test suite"
cmd = "pytest"

[tasks.cov]
help = "Run the test suite with a coverage report"
sequence = [
    { cmd = "coverage run -m pytest" },
    { cmd = "coverage report" }
]

[tasks.cov-html]
help = "Run the test suite with a coverage HTML report"
sequence = [
    { cmd = "coverage run -m pytest" },
    { cmd = "coverage html" }
]

[tasks.hooks]
help = "Run all pre-commit hooks on all files"
cmd = "pre-commit run --all-files"

[tasks.fix]
help = "Auto-fix lint findings and format all code"
sequence = [
    { cmd = "ruff check --fix" },
    { cmd = "ruff format" }
]

[tasks.check]
help = "Run all checks, like CI does"
sequence = [
    "format-check",
    "lint",
    "imports",
    "typecheck",
    "cov",
    "docs-build"
]

[tasks.docs]
help = "Serve the Zensical documentation locally with live reload"
cmd = "zensical serve"

[tasks.docs-build]
help = "Build the Zensical documentation and fail on any warning"
cmd = "zensical build --strict"
