[project]
name = "pytest-stepline"
version = "0.0.1"
description = "Structured pytest tests with steps, typed assertions, and test documentation."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "Steven Karbjinsky", email = "steven.karbjinsky@web.de" }
]
requires-python = ">=3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
keywords = ["pytest", "testing", "test-steps", "assertions", "qa"]
dependencies = [
    "rich>=15.0.0",
    "typer>=0.29.1",
]

[project.urls]
Documentation = "https://xkabbe.github.io/stepline/"
Homepage = "https://github.com/xKabbe/stepline"
Repository = "https://github.com/xKabbe/stepline"
Issues = "https://github.com/xKabbe/stepline/issues"
Changelog = "https://github.com/xKabbe/stepline/blob/main/CHANGELOG.md"

[project.scripts]
stepline = "stepline._cli.app:main"

[project.entry-points.pytest11]
stepline = "stepline._pytest.plugin"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "stepline"

[dependency-groups]
dev = [
    "import-linter>=2.17",
    "poethepoet>=0.49.0",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "zensical>=0.1.3",
]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
    "-ra"
]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["stepline"]
branch = true
dynamic_context = "test_function"

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "raise NotImplementedError"
]

[tool.coverage.html]
show_contexts = true
skip_covered = false
