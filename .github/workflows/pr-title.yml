name: stepline PR Title 🏷️
run-name: ${{ github.actor }} triggered the PR title workflow

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  pull-requests: read

jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Commits format 🏷️
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            docs
            refactor
            test
            build
            ci
            chore
            revert
          scopes: |
            assertions
            steps
            metadata
            console
            cli
            tooling
            docs
            deps
            deps-dev
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" in the pull request title "{title}"
            must start with a lowercase letter.
          ignoreLabels: |
            autorelease: pending
